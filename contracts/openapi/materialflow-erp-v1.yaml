openapi: 3.1.0
info:
  title: MaterialFlow ERP API
  version: 1.0.0
  description: Versioned command and authoritative-query API for the synthetic MaterialFlow ERP.
  license:
    name: Private local-only reference; no redistribution grant
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8081
security:
  - bearerAuth: []
tags:
  - name: Orders
    description: Authoritative sales-order commands and queries.
  - name: Approvals
    description: Maker-checker decisions against frozen approval instances.
  - name: Fulfillment
    description: Idempotent inventory-backed shipment commands.
  - name: Billing
    description: Shipment invoicing, synthetic payment files and reconciliation.
  - name: Procurement
    description: Purchase requests, approvals, orders and receipts.
paths:
  /api/v1/orders:
    post:
      summary: Submit a sales order
      tags: [Orders]
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/WarehouseScope'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Created, reserved, backordered, or pending approval.
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/orders/{orderId}:
    get:
      summary: Read an authoritative sales order
      tags: [Orders]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/WarehouseScope'
      responses:
        '200': {description: Authoritative order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/orders/{orderId}/cancel:
    post:
      summary: Cancel an order and release outstanding reservations
      tags: [Orders]
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/WarehouseScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {description: Order cancelled and outstanding credit and inventory released, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/approvals/{approvalId}/decisions:
    post:
      summary: Record a maker-checker approval decision
      tags: [Approvals]
      operationId: decideApproval
      parameters:
        - {$ref: '#/components/parameters/ApprovalId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, REJECT]}
                reason: {type: string, maxLength: 500}
      responses:
        '200': {description: Decision result, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/orders/{orderId}/shipments:
    post:
      summary: Ship reserved order quantities
      tags: [Fulfillment]
      operationId: createShipment
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [reservationId, quantity]
                    properties:
                      reservationId: {type: string, format: uuid}
                      quantity: {$ref: '#/components/schemas/PositiveQuantity'}
      responses:
        '201': {description: Shipment created, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/orders/{orderId}/invoices:
    post:
      summary: Invoice uninvoiced shipment lines
      tags: [Billing]
      operationId: createInvoice
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      responses:
        '201': {description: Invoice created from uninvoiced shipment lines, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/payments/files:
    post:
      summary: Import a bounded synthetic payment file
      tags: [Billing]
      operationId: importPaymentFile
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentFile'}
      responses:
        '201': {description: File imported and matched or queued as exceptions, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/procurement/purchase-requests:
    post:
      summary: Create a purchase request
      tags: [Procurement]
      operationId: createPurchaseRequest
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePurchaseRequest'}
      responses:
        '201': {description: Purchase request pending approval, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/procurement/purchase-requests/{requestId}/approve:
    post:
      summary: Approve a purchase request and create its purchase order
      tags: [Procurement]
      operationId: approvePurchaseRequest
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      responses:
        '200': {description: Approved request and generated purchase order, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/procurement/purchase-orders/{purchaseOrderId}/receipts:
    post:
      summary: Receive purchase-order quantities into inventory
      tags: [Procurement]
      operationId: receivePurchaseOrder
      parameters:
        - {name: purchaseOrderId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/Roles'}
        - {$ref: '#/components/parameters/WarehouseScope'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [purchaseOrderLineId, quantity]
                    properties:
                      purchaseOrderLineId: {type: string, format: uuid}
                      quantity: {$ref: '#/components/schemas/PositiveQuantity'}
      responses:
        '201': {description: Partial or complete receipt, content: {application/json: {schema: {type: object}}}}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 160}}
    OrganizationId: {name: X-Organization-Id, in: header, required: true, schema: {type: string, format: uuid}}
    ActorId: {name: X-Actor-Id, in: header, required: true, schema: {type: string, format: uuid}}
    Roles: {name: X-Roles, in: header, required: false, schema: {type: string}, description: Local-only mode; ignored when JWT security is enabled.}
    WarehouseScope: {name: X-Warehouse-Scope, in: header, required: false, schema: {type: string}, description: Comma-separated UUIDs.}
    OrderId: {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
    ApprovalId: {name: approvalId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Stable safe error response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    PositiveQuantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.000001}
    Money: {type: number, minimum: 0, multipleOf: 0.01}
    CreateOrderRequest:
      type: object
      required: [customerId, allowPartialFulfillment, lines]
      properties:
        customerId: {type: string, format: uuid}
        allowPartialFulfillment: {type: boolean}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [materialId, warehouseId, locationId, quantity]
            properties:
              materialId: {type: string, format: uuid}
              warehouseId: {type: string, format: uuid}
              locationId: {type: string, format: uuid}
              quantity: {$ref: '#/components/schemas/PositiveQuantity'}
              manualUnitPrice: {$ref: '#/components/schemas/Money'}
              manualDiscountRate: {type: number, minimum: 0, maximum: 1}
              overrideReason: {type: string, maxLength: 500}
    Order:
      type: object
      required: [id, orderNumber, customerId, status, totalAmount, version, lines]
      properties:
        id: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string, format: uuid}
        status: {type: string}
        totalAmount: {$ref: '#/components/schemas/Money'}
        approvalInstanceId: {type: [string, 'null'], format: uuid}
        version: {type: integer, minimum: 0}
        lines: {type: array, items: {type: object}}
    PaymentFile:
      type: object
      required: [fileName, records]
      properties:
        fileName: {type: string, maxLength: 255}
        records:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [externalReference, amount, valueDate]
            properties:
              externalReference: {type: string, maxLength: 120}
              invoiceReference: {type: [string, 'null'], maxLength: 64}
              orderReference: {type: [string, 'null'], maxLength: 64}
              amount: {$ref: '#/components/schemas/Money'}
              valueDate: {type: string, format: date}
    CreatePurchaseRequest:
      type: object
      required: [supplierId, lines]
      properties:
        supplierId: {type: string, format: uuid}
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [suggestionId, locationId, quantity, unitCost]
            properties:
              suggestionId: {type: string, format: uuid}
              locationId: {type: string, format: uuid}
              quantity: {$ref: '#/components/schemas/PositiveQuantity'}
              unitCost: {$ref: '#/components/schemas/Money'}
    ApiError:
      type: object
      required: [errorCode, message, traceId, timestamp, fieldErrors]
      properties:
        errorCode: {type: string}
        message: {type: string}
        traceId: {type: string}
        timestamp: {type: string, format: date-time}
        fieldErrors: {type: object, additionalProperties: {type: string}}
