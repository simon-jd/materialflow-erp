# Static SPA server. Files under /tmp/materialflow are generated at container start.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    # Optional same-origin reverse proxy for /api/ (empty unless API_UPSTREAM is set).
    include /tmp/materialflow/api-proxy.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        alias /tmp/materialflow/config.js;
        default_type text/javascript;
        include /tmp/materialflow/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed bundles never change under the same name.
    location /assets/ {
        include /tmp/materialflow/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must always be revalidated.
    location / {
        include /tmp/materialflow/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
