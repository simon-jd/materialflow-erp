name: cd-aws

# Continuous delivery of main to the AWS dev environment defined in deploy/terraform/aws.
# Every job is skipped unless the AWS_DEPLOY_ROLE_ARN repository variable exists, so the public
# repository and its forks show skipped runs rather than failures. Credentials are short-lived
# OIDC sessions; no AWS keys are stored. Setup: docs/runbooks/aws-deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      images_only:
        description: Push images without deploying (first bootstrap, before the ECS services exist)
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a rollout halfway.
concurrency:
  group: cd-aws-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PREFIX: ${{ vars.AWS_RESOURCE_PREFIX }}
  IMAGE_TAG: ${{ github.sha }}
  # Keep equal to kafka_tools_image_tag in deploy/terraform/aws/variables.tf.
  KAFKA_TOOLS_VERSION: 4.1.2

jobs:
  build:
    name: Build and test
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test and package
        run: mvn -B -ntp verify
      # The images package exactly these tested JARs (deploy/docker/Dockerfile.runtime).
      - name: Collect application JARs
        run: |
          mkdir -p jars
          for app in erp-core event-relay edge-gateway stream-projection integration-adapter; do
            cp "apps/${app}/target/${app}-0.1.0-SNAPSHOT.jar" "jars/${app}.jar"
          done
          sha256sum jars/*.jar | tee jars/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: jars/
          retention-days: 7
          if-no-files-found: error

  images:
    name: Push linux/arm64 images
    needs: build
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: jars
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # Only the short runtime stage (apk) runs under emulation; the JARs come from the build job.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # Tags are immutable in ECR: skip images a previous attempt of this commit already pushed.
          pushed() {
            aws ecr describe-images --repository-name "${PREFIX}/$1" --image-ids "imageTag=$2" >/dev/null 2>&1
          }
          # Single-platform manifests without attestations keep ECR lifecycle rules simple.
          build() {
            docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push "$@"
          }

          cp deploy/docker/Dockerfile.runtime jars/Dockerfile
          for app in erp-core event-relay edge-gateway stream-projection integration-adapter; do
            if pushed "$app" "$IMAGE_TAG"; then echo "${app}:${IMAGE_TAG} exists"; continue; fi
            build --build-arg "JAR_FILE=${app}.jar" --tag "${REGISTRY}/${PREFIX}/${app}:${IMAGE_TAG}" jars
          done

          if ! pushed keycloak "$IMAGE_TAG"; then
            build --file deploy/docker/Dockerfile.keycloak --tag "${REGISTRY}/${PREFIX}/keycloak:${IMAGE_TAG}" .
          fi

          # Mirror of the Kafka CLI image used by stream-projection's topic init container.
          if ! pushed kafka-tools "$KAFKA_TOOLS_VERSION"; then
            echo "FROM docker.io/apache/kafka:${KAFKA_TOOLS_VERSION}" |
              build --tag "${REGISTRY}/${PREFIX}/kafka-tools:${KAFKA_TOOLS_VERSION}" -
          fi

  # erp-core runs the Flyway migrations, so it rolls out (and must become healthy) before the
  # services that read its schema or call it. Keycloak goes first with it: it issues the tokens.
  deploy-core:
    name: Deploy ${{ matrix.service }}
    needs: images
    if: ${{ !inputs.images_only }}
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: [keycloak, erp-core]
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # Terraform owns the task definition shape; start from the family's newest revision so
      # Terraform changes ship with the next image.
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.PREFIX }}-${{ matrix.service }}
          container-name: ${{ matrix.service }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
      # The service's deployment circuit breaker rolls back automatically if new tasks never
      # become healthy; the wait then fails this job.
      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.PREFIX }}
          service: ${{ matrix.service }}
          wait-for-service-stability: true
          wait-for-minutes: 20

  deploy-services:
    name: Deploy ${{ matrix.service }}
    needs: deploy-core
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: [event-relay, stream-projection, integration-adapter, edge-gateway]
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.PREFIX }}-${{ matrix.service }}
          container-name: ${{ matrix.service }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.PREFIX }}
          service: ${{ matrix.service }}
          wait-for-service-stability: true
          wait-for-minutes: 20

  console:
    name: Publish admin console
    needs: deploy-services
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: Check for the admin console
        run: |
          if [[ -f apps/admin-console/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/admin-console is not in this commit; skipping the console publish."
          fi
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json
      - if: steps.check.outputs.present == 'true'
        name: Build
        working-directory: apps/admin-console
        run: npm ci && npm run build
      # Same-origin deployment: the API (/api) and Keycloak (/idp) share the CloudFront origin, so
      # apiBaseUrl stays empty. Same shape as the console's own nginx entrypoint writes.
      - if: steps.check.outputs.present == 'true'
        name: Write runtime configuration
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          jq -cn --arg authority "${PUBLIC_BASE_URL}/idp/realms/materialflow" \
            '{apiBaseUrl: "", oidcAuthority: $authority, oidcClientId: "materialflow-admin-console"}' |
            { printf 'window.__MATERIALFLOW_CONFIG__ = Object.freeze('; cat; printf ');\n'; } > apps/admin-console/dist/config.js
          cat apps/admin-console/dist/config.js
      - if: steps.check.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Hashed assets first and cached for a year; then the entry points, which are never cached,
      # so a new index.html never references an asset that is not uploaded yet.
      - if: steps.check.outputs.present == 'true'
        name: Sync to S3 and invalidate the entry points
        env:
          BUCKET: ${{ vars.CONSOLE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        working-directory: apps/admin-console/dist
        run: |
          aws s3 sync . "s3://${BUCKET}" --delete --exclude index.html --exclude config.js \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp config.js "s3://${BUCKET}/config.js" --cache-control "no-cache" \
            --content-type "application/javascript"
          aws s3 cp index.html "s3://${BUCKET}/index.html" --cache-control "no-cache"
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths /index.html /config.js --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation"

  smoke:
    name: Smoke test
    needs: console
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Health and one authenticated read through CloudFront
        env:
          MATERIALFLOW_PUBLIC_URL: ${{ vars.PUBLIC_BASE_URL }}
          SMOKE_CONSOLE: ${{ needs.console.outputs.published }}
        run: bash tests/deployment/aws-smoke.sh
