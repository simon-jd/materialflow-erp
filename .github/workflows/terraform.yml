name: terraform

# Static checks for deploy/terraform. Nothing here needs AWS credentials: init skips the backend,
# `terraform test` uses mocked providers and tflint's deep (API) checks are off.

on:
  pull_request:
    paths:
      - deploy/terraform/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - deploy/terraform/**
      - .github/workflows/terraform.yml

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.17.2
  TFLINT_VERSION: v0.66.0
  TRIVY_VERSION: v0.76.2

jobs:
  validate:
    name: fmt, validate, test, tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/terraform/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Init without backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Offline tests (mocked providers)
        run: terraform test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('deploy/terraform/aws/.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Lint (terraform + AWS rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  scan:
    name: Trivy IaC scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Accepted findings carry an inline #trivy:ignore with the reason next to the resource.
      - name: Scan Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: deploy/terraform/aws
          skip-dirs: deploy/terraform/aws/.terraform
          format: sarif
          output: trivy-iac.sarif
          exit-code: '1'
      - name: Preserve scan evidence
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-iac
          path: trivy-iac.sarif
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && hashFiles('trivy-iac.sarif') != '' && (!github.event.repository.private || vars.CODE_SCANNING_ENABLED == 'true')
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
