{{- range $name, $component := .Values.components }}
{{- if $component.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: materialflow-{{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: materialflow-{{ $name }}}
  minReplicas: {{ $component.autoscaling.minReplicas }}
  maxReplicas: {{ $component.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $component.autoscaling.cpu }}}
{{- end }}
{{- end }}
