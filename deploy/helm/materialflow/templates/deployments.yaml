{{- $fault := .Values.faultInjection }}
{{- range $name, $component := .Values.components }}
{{- $faultTarget := and $fault.enabled (has $name $fault.sharedProcessNamespace) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: materialflow-{{ $name }}
  labels:
    {{- include "materialflow.labels" $ | nindent 4 }}
    app.kubernetes.io/name: materialflow-{{ $name }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {{- toYaml (default $.Values.global.rollingUpdate $component.rollingUpdate) | nindent 6 }}
  selector:
    matchLabels: {app.kubernetes.io/name: materialflow-{{ $name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: materialflow-{{ $name }}
        app.kubernetes.io/part-of: materialflow
        {{- if $faultTarget }}
        materialflow.io/fault-injection: "enabled"
        {{- end }}
    spec:
      serviceAccountName: materialflow
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $component.terminationGracePeriodSeconds | default 45 }}
      {{- if $faultTarget }}
      # Fault drills only. Inside its own PID namespace the JVM is PID 1, and the kernel drops a
      # SIGKILL sent to PID 1 from within that namespace. With a shared namespace the pause
      # container is PID 1, so `kubectl exec ... -- kill -KILL <java pid>` really kills the JVM.
      # The kubelet then restarts the container in place: same pod, same IP, restartCount + 1.
      shareProcessNamespace: true
      {{- end }}
      # Deployments only allow Always. A killed container is restarted immediately the first time;
      # after that the kubelet waits until the crash back-off (10 s doubling to 300 s) has passed
      # since the container exited, however long it ran; it resets after 10 min between two exits.
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- include "materialflow.placement" (dict "root" $ "name" (printf "materialflow-%s" $name)) | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ required "global.imageTag is required" $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - {name: http, containerPort: {{ $component.port }}}
            {{- if $component.grpcPort }}
            - {name: grpc, containerPort: {{ $component.grpcPort }}}
            {{- end }}
          envFrom:
            - configMapRef: {name: materialflow-runtime}
            - secretRef: {name: {{ $.Values.global.existingSecret }}}
          {{- $profile := and $fault.enabled (has $name $fault.springProfile) }}
          {{- if or $component.env $profile }}
          env:
            {{- range $key, $value := $component.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
            {{- if $profile }}
            # Installs the advisory-lock crash-window gate (ConsumerCrashWindowGate.PROFILE).
            - {name: SPRING_PROFILES_ACTIVE, value: fault-injection}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            failureThreshold: {{ $.Values.global.startupFailureThreshold | default 30 }}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          {{- include "materialflow.preStop" $ | nindent 10 }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "materialflow.secretsStoreMount" $ | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        {{- include "materialflow.secretsStoreVolume" $ | nindent 8 }}
{{- end }}
