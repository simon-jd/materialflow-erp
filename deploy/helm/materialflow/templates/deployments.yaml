{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: materialflow-{{ $name }}
  labels:
    {{- include "materialflow.labels" $ | nindent 4 }}
    app.kubernetes.io/name: materialflow-{{ $name }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: materialflow-{{ $name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: materialflow-{{ $name }}
        app.kubernetes.io/part-of: materialflow
    spec:
      serviceAccountName: materialflow
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - {name: http, containerPort: {{ $component.port }}}
            {{- if $component.grpcPort }}
            - {name: grpc, containerPort: {{ $component.grpcPort }}}
            {{- end }}
          envFrom:
            - configMapRef: {name: materialflow-runtime}
            - secretRef: {name: {{ $.Values.global.existingSecret }}}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
{{- end }}
