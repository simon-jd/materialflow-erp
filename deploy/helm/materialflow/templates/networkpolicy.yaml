apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: materialflow-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: materialflow}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: materialflow}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: materialflow}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
