global:
  imageRegistry: materialflow
  imageTag: "0.1.0"
  imagePullPolicy: IfNotPresent
  existingSecret: materialflow-runtime
  otelEndpoint: http://otel-collector:4318/v1/traces
  # Default for every Deployment; a component (or adminConsole) can override it with its own
  # rollingUpdate. Surge keeps full capacity during a rollout when the cluster has room for it.
  rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  # Pod placement for every Deployment in the chart.
  nodeSelector: {}
  tolerations: []
  spreadAcrossNodes: false
  # Seconds a terminating pod keeps serving while its endpoint is removed from Services/proxies.
  preStopSleepSeconds: 0
  startupFailureThreshold: 30

config:
  postgresUrl: jdbc:postgresql://postgres:5432/materialflow
  redisHost: redis
  kafkaBootstrapServers: kafka:9092
  erpCoreUri: http://materialflow-erp-core:8080
  projectionUri: http://materialflow-stream-projection:8082
  oidcIssuerUri: http://keycloak:8080/realms/materialflow
  oidcJwkSetUri: http://keycloak:8080/realms/materialflow/protocol/openid-connect/certs
  securityEnabled: "true"
  # When set, the database user goes into the ConfigMap and the Secret only carries passwords.
  dbUser: ""
  # Extra non-secret environment variables for every service (Spring relaxed binding).
  extra: {}

serviceAccount:
  annotations: {}

# Mount a Secrets Store CSI SecretProviderClass (Azure Key Vault) into every pod. The driver
# syncs the mounted objects into global.existingSecret, which the pods read through envFrom.
secretsStore:
  enabled: false
  secretProviderClass: materialflow-runtime

networkPolicy:
  enabled: true
  # Appended to the default-deny policy's ingress and egress rules.
  extraIngress: []
  extraEgress: []

# Process-kill fault drills (tests/failure). Never enable on a shared environment.
faultInjection:
  enabled: false
  # Pods that share one PID namespace so a drill can SIGKILL the JVM (it is not PID 1 then).
  sharedProcessNamespace: [erp-core, event-relay]
  # Services that run with the fault-injection Spring profile (erp-core's crash-window gate).
  springProfile: [erp-core]

components:
  erp-core:
    port: 8080
    replicas: 2
    autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 6, cpu: 70}
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 1Gi}
  event-relay:
    port: 8084
    replicas: 2
    autoscaling: {enabled: false}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
  edge-gateway:
    port: 8081
    replicas: 2
    autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 8, cpu: 65}
    env:
      # Retire pooled upstream connections after 5 s. A pooled keep-alive connection stays bound to
      # the pod it was opened to after that pod leaves the Service, and a request sent on it just as
      # the pod's graceful shutdown closes it fails with PrematureCloseException (HTTP 500). Keep this
      # well below global.preStopSleepSeconds (10 s on AKS), so no pooled connection to a
      # terminating pod is left when it receives SIGTERM (docs/evidence/azure-2026-11-24-zero-downtime).
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_POOL_MAXLIFETIME: 5s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
  stream-projection:
    port: 8082
    replicas: 2
    autoscaling: {enabled: false}
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "2", memory: 1Gi}
  integration-adapter:
    port: 8083
    grpcPort: 9090
    replicas: 2
    autoscaling: {enabled: false}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}

# Optional React admin console (nginx, non-root). Disabled by default. Serve it and the gateway on one
# origin: either route /api at the ingress, or keep apiUpstream so nginx proxies /api/ in-cluster.
adminConsole:
  enabled: false
  replicas: 2
  port: 8080
  apiBaseUrl: ""
  apiUpstream: http://materialflow-edge-gateway:8081
  # Browser-facing issuer URL, e.g. https://id.example.com/realms/materialflow (required when enabled).
  oidcAuthority: ""
  oidcClientId: materialflow-admin-console
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
