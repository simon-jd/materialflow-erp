# Workload identity: the CSI driver exchanges this service account's token (or the application
# chart's `materialflow` account) for an Entra ID token of the user-assigned identity that may
# read the Key Vault. Both subjects have a federated credential (deploy/terraform/azure/identity.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: materialflow-platform
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "platform.keyVault.clientId is required" .Values.platform.keyVault.clientId | quote }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretProviderClass }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.platform.keyVault.clientId | quote }}
    keyvaultName: {{ required "platform.keyVault.name is required" .Values.platform.keyVault.name | quote }}
    tenantId: {{ required "platform.keyVault.tenantId is required" .Values.platform.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-admin-password
          objectType: secret
        - |
          objectName: keycloak-bootstrap-admin-password
          objectType: secret
  # Synced Kubernetes Secrets exist while at least one pod mounts this class. The applications
  # read only materialflow-runtime; Keycloak reads only materialflow-keycloak.
  secretObjects:
    - secretName: materialflow-runtime
      type: Opaque
      data:
        - {objectName: postgres-admin-password, key: MATERIALFLOW_DB_PASSWORD}
        - {objectName: postgres-admin-password, key: POSTGRES_PASSWORD}
    - secretName: materialflow-keycloak
      type: Opaque
      data:
        - {objectName: postgres-admin-password, key: KC_DB_PASSWORD}
        - {objectName: keycloak-bootstrap-admin-password, key: KC_BOOTSTRAP_ADMIN_PASSWORD}
