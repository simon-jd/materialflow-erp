# Redis holds only rate-limiter buckets (ADR 0004: losing it fails sensitive writes closed).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: materialflow}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform.podSecurity" . | nindent 8 }}
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "platform.mirror" (dict "root" . "image" .Values.redis.image) }}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          args: [redis-server, --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
# In-memory trace store for the API -> outbox -> Kafka -> consumer trace (no paid monitoring).
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: query, port: 16686, targetPort: 16686}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger, app.kubernetes.io/part-of: materialflow}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform.podSecurity" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: jaeger
          image: {{ include "platform.mirror" (dict "root" . "image" .Values.jaeger.image) }}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: query, containerPort: 16686}
          readinessProbe:
            tcpSocket: {port: query}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
