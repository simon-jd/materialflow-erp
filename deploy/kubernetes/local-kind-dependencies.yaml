apiVersion: v1
kind: Namespace
metadata:
  name: materialflow
---
apiVersion: v1
kind: Secret
metadata:
  name: materialflow-runtime
  namespace: materialflow
type: Opaque
stringData:
  MATERIALFLOW_DB_USER: materialflow
  MATERIALFLOW_DB_PASSWORD: synthetic-kind-only
  POSTGRES_USER: materialflow
  POSTGRES_PASSWORD: synthetic-kind-only
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: materialflow
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: materialflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, app.kubernetes.io/part-of: materialflow}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: materialflow}
            - {name: POSTGRES_USER, value: materialflow}
            - {name: POSTGRES_PASSWORD, value: synthetic-kind-only}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, materialflow, -d, materialflow]}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: runtime, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: materialflow
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: materialflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: materialflow}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:8.2.1-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          args: [redis-server, --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: materialflow
spec:
  selector: {app: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: materialflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka, app.kubernetes.io/part-of: materialflow}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: kafka-config-init
          image: apache/kafka:4.1.2
          command: [sh, -c, "cp -R /opt/kafka/config/. /writable-config/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /writable-config}
      containers:
        - name: kafka
          image: apache/kafka:4.1.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          readinessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: config, mountPath: /opt/kafka/config}
            - {name: logs, mountPath: /opt/kafka/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: materialflow
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: query, port: 16686, targetPort: 16686}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: materialflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger, app.kubernetes.io/part-of: materialflow}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.10.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: query, containerPort: 16686}
          readinessProbe:
            tcpSocket: {port: query}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
