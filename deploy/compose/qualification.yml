# Isolated, loopback-only synthetic qualification stack. Requires Compose >= 2.24.4.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_POSTGRES_PORT:-25432}:5432"
  redis:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_REDIS_PORT:-26379}:6379"
  kafka:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_KAFKA_PORT:-29094}:29092"
  keycloak:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_KEYCLOAK_PORT:-28180}:8080"
  jaeger:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_JAEGER_PORT:-26686}:16686"
      - "127.0.0.1:${MATERIALFLOW_JAEGER_OTLP_PORT:-24317}:4317"
  otel-collector:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_OTLP_GRPC_PORT:-24318}:4317"
      - "127.0.0.1:${MATERIALFLOW_OTLP_HTTP_PORT:-24319}:4318"
      - "127.0.0.1:${MATERIALFLOW_OTEL_METRICS_PORT:-28889}:8889"
  prometheus:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_PROMETHEUS_PORT:-29095}:9090"
  grafana:
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_GRAFANA_PORT:-23000}:3000"
  erp-core:
    build: !reset null
    image: materialflow-qualification/erp-core:${QUALIFICATION_TAG:-boot4}
    restart: "no"
    mem_limit: 1g
    cpus: 2.0
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_ERP_PORT:-28080}:8080"
  event-relay:
    build: !reset null
    image: materialflow-qualification/event-relay:${QUALIFICATION_TAG:-boot4}
    restart: "no"
    mem_limit: 1g
    cpus: 2.0
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_RELAY_PORT:-28084}:8084"
  edge-gateway:
    build: !reset null
    image: materialflow-qualification/edge-gateway:${QUALIFICATION_TAG:-boot4}
    restart: "no"
    mem_limit: 1g
    cpus: 2.0
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_GATEWAY_PORT:-28081}:8081"
  stream-projection:
    build: !reset null
    image: materialflow-qualification/stream-projection:${QUALIFICATION_TAG:-boot4}
    restart: "no"
    mem_limit: 1g
    cpus: 2.0
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_PROJECTION_PORT:-28082}:8082"
  integration-adapter:
    build: !reset null
    image: materialflow-qualification/integration-adapter:${QUALIFICATION_TAG:-boot4}
    restart: "no"
    mem_limit: 1g
    cpus: 2.0
    ports: !override
      - "127.0.0.1:${MATERIALFLOW_INTEGRATION_PORT:-28083}:8083"
      - "127.0.0.1:${MATERIALFLOW_GRPC_PORT:-29090}:9090"
